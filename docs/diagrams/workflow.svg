<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 960" width="1280" height="960" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang TC','Noto Sans CJK TC',sans-serif">
  <defs>
    <marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="1280" height="960" fill="#ffffff"/>

  <text x="60" y="38" font-size="23" font-weight="700" fill="#0f172a">Workflow — một lượt hỏi đáp, từ đầu đến cuối</text>
  <text x="60" y="60" font-size="13" fill="#64748b">Câu hỏi thật: “最近有什麼新消息？” — các chặng và mốc thời gian copy nguyên từ trace panel</text>

  <rect x="60" y="80" width="820" height="856" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="84" y="104" font-size="11.5" font-weight="700" fill="#2563eb" letter-spacing="1.3">MCP CLIENT — src/client</text>
  <rect x="896" y="80" width="324" height="856" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="920" y="104" font-size="11.5" font-weight="700" fill="#059669" letter-spacing="1.3">MCP SERVER — src/server</text>

  <rect x="84" y="116" width="772" height="46" rx="23" fill="#1e293b"/>
  <text x="108" y="145" font-size="14" fill="#ffffff">Người dùng:  “最近有什麼新消息？”   (Gần đây có tin gì mới?)</text>
  <path d="M470,162 L470,182" stroke="#2563eb" stroke-width="2" marker-end="url(#w)"/>

  <rect x="84" y="186" width="772" height="58" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="110" cy="215" r="14" fill="#2563eb"/><text x="110" y="220" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="136" y="210" font-size="14" font-weight="700" fill="#1e40af">intent — phân loại ý định</text>
  <text x="136" y="231" font-size="11.5" fill="#475569">Luật khớp trước: vốn từ trong phạm vi → <tspan font-weight="700">knowledge (0.80)</tspan>. Không gọi LLM.</text>
  <rect x="712" y="199" width="128" height="32" rx="6" fill="#dcfce7"/><text x="776" y="219" font-size="11.5" font-weight="700" fill="#166534" text-anchor="middle">~0 ms · 0 token</text>
  <path d="M470,244 L470,262" stroke="#2563eb" stroke-width="2" marker-end="url(#w)"/>

  <rect x="84" y="266" width="772" height="58" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="110" cy="295" r="14" fill="#2563eb"/><text x="110" y="300" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="136" y="290" font-size="14" font-weight="700" fill="#1e40af">router — tra bảng</text>
  <text x="136" y="311" font-size="11.5" fill="#475569">knowledge → [ tool_selector · retrieval · answer ].   Chitchat / meta / out_of_scope → trả lời sẵn, bỏ qua retrieval.</text>
  <path d="M470,324 L470,342" stroke="#2563eb" stroke-width="2" marker-end="url(#w)"/>

  <rect x="84" y="346" width="772" height="76" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="110" cy="384" r="14" fill="#2563eb"/><text x="110" y="389" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="136" y="369" font-size="14" font-weight="700" fill="#1e40af">tool_selector — chọn công cụ</text>
  <text x="136" y="390" font-size="11.5" fill="#475569">Đọc schema 6 tool server gửi lúc MCP discovery → chọn <tspan font-weight="700" fill="#047857">get_news</tspan> (câu này cần sắp theo NGÀY, không phải độ liên quan).</text>
  <text x="136" y="409" font-size="11.5" fill="#b45309">Tên tool được đối chiếu lại với danh sách server thật sự quảng cáo — chặn trường hợp LLM bịa tên tool.</text>
  <path d="M470,422 L470,440" stroke="#2563eb" stroke-width="2" marker-end="url(#w)"/>

  <rect x="84" y="444" width="772" height="72" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="110" cy="479" r="14" fill="#2563eb"/><text x="110" y="484" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text>
  <text x="136" y="467" font-size="14" font-weight="700" fill="#1e40af">retrieval — viết lại truy vấn</text>
  <text x="136" y="487" font-size="11.5" fill="#475569">Ghép chủ đề + thực thể từ <tspan font-weight="700">working memory</tspan> → 2 biến thể truy vấn, bắn song song.</text>
  <text x="136" y="506" font-size="11.5" fill="#64748b">Đây là chặng làm cho “那個學程呢？” trả lời được: câu không có chủ ngữ được giải TRƯỚC khi đi tìm.</text>
  <path d="M470,516 L470,534" stroke="#2563eb" stroke-width="2" marker-end="url(#w)"/>

  <rect x="84" y="538" width="772" height="56" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <circle cx="110" cy="566" r="14" fill="#7c3aed"/><text x="110" y="571" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">5</text>
  <text x="136" y="561" font-size="14" font-weight="700" fill="#6d28d9">Gọi MCP — JSON-RPC qua stdio</text>
  <text x="380" y="561" font-size="12" fill="#475569">get_news(limit=5)</text>
  <text x="136" y="582" font-size="11.5" fill="#64748b">Ranh giới tiến trình. Từ đây trở đi là server — nó không biết gì về hội thoại phía trên.</text>
  <path d="M860,552 L904,552" stroke="#059669" stroke-width="2" marker-end="url(#g)"/>
  <path d="M904,580 L860,580" stroke="#059669" stroke-width="2" marker-end="url(#g)"/>
  <text x="882" y="546" font-size="9.5" fill="#059669" text-anchor="middle">gọi</text>
  <text x="882" y="596" font-size="9.5" fill="#059669" text-anchor="middle">5 bản ghi</text>

  <rect x="912" y="530" width="292" height="72" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="928" y="552" font-size="12.5" font-weight="700" fill="#047857">retriever.search / get_news</text>
  <text x="928" y="571" font-size="11" fill="#475569">ChromaDB dense top-12 + BM25 top-12</text>
  <text x="928" y="587" font-size="11" fill="#475569">→ RRF sắp xếp → confidence chấm riêng</text>

  <path d="M470,594 L470,608" stroke="#7c3aed" stroke-width="2" marker-end="url(#w)"/>
  <rect x="84" y="612" width="772" height="58" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 3"/>
  <circle cx="110" cy="641" r="14" fill="#7c3aed"/><text x="110" y="646" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">6</text>
  <text x="136" y="635" font-size="14" font-weight="700" fill="#6d28d9">Deep read — có điều kiện, tối đa 1 lần</text>
  <text x="136" y="656" font-size="11.5" fill="#475569">Đoạn tốt nhất &lt; 300 ký tự → get_document(url). Cứu một đoạn bị cắt, không kéo cả trang vào prompt.</text>
  <path d="M860,630 L904,630" stroke="#059669" stroke-width="2" marker-end="url(#g)"/>
  <path d="M904,654 L860,654" stroke="#059669" stroke-width="2" marker-end="url(#g)"/>
  <rect x="912" y="612" width="292" height="58" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="928" y="634" font-size="12.5" font-weight="700" fill="#047857">retriever.get_document</text>
  <text x="928" y="653" font-size="11" fill="#475569">toàn văn một trang (cắt ở 1500 ký tự)</text>

  <path d="M470,670 L470,686" stroke="#2563eb" stroke-width="2" marker-end="url(#w)"/>

  <rect x="84" y="690" width="772" height="76" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <circle cx="110" cy="728" r="14" fill="#dc2626"/><text x="110" y="733" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">7</text>
  <text x="136" y="713" font-size="14" font-weight="700" fill="#b91c1c">CỔNG TỪ CHỐI — trong luồng điều khiển, TRƯỚC khi gọi LLM</text>
  <text x="136" y="734" font-size="11.5" fill="#475569">điểm đoạn tốt nhất  ≥  MIN_SCORE = 0.854 ?    (ngưỡng hiệu chỉnh bằng calibrate.py, không phải đoán)</text>
  <text x="136" y="753" font-size="11.5" fill="#b91c1c">Đặt ở đây vì: model được đưa ngữ cảnh yếu vẫn viết ra đoạn văn đầy tự tin. Prompt không chặn được.</text>
  <path d="M860,726 L904,726" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#r)"/>
  <text x="882" y="719" font-size="9.5" font-weight="700" fill="#dc2626" text-anchor="middle">KHÔNG</text>
  <rect x="912" y="690" width="292" height="72" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="928" y="712" font-size="12.5" font-weight="700" fill="#b91c1c">Từ chối, và nói rõ lý do</text>
  <text x="928" y="731" font-size="11" fill="#475569">Không gọi LLM. Không đoán.</text>
  <text x="928" y="748" font-size="11" fill="#475569">Nêu rõ phạm vi index hiện tại.</text>

  <text x="488" y="783" font-size="10.5" font-weight="700" fill="#16a34a">CÓ</text>
  <path d="M470,766 L470,788" stroke="#16a34a" stroke-width="2" marker-end="url(#gr)"/>

  <rect x="84" y="792" width="772" height="58" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="110" cy="821" r="14" fill="#2563eb"/><text x="110" y="826" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">8</text>
  <text x="136" y="815" font-size="14" font-weight="700" fill="#1e40af">answer — sinh câu trả lời có trích dẫn</text>
  <text x="136" y="837" font-size="11.5" fill="#475569">Mỗi câu khẳng định mang <tspan font-weight="700">[n]</tspan> ứng với một đoạn.   Không có LLM → trích nguyên văn, vẫn có citation.</text>
  <path d="M470,850 L470,866" stroke="#2563eb" stroke-width="2" marker-end="url(#w)"/>

  <rect x="84" y="870" width="772" height="52" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="110" cy="896" r="14" fill="#2563eb"/><text x="110" y="901" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">9</text>
  <text x="136" y="891" font-size="13.5" font-weight="700" fill="#1e40af">Cập nhật memory → lưu đĩa → (mỗi 8 lượt) chạy summary</text>
  <text x="136" y="910" font-size="11.5" fill="#475569">Lưu lượt hội thoại TRƯỚC khi tóm tắt: tóm tắt là best-effort, không được làm mất lượt đã kích hoạt nó.</text>

  <rect x="912" y="790" width="292" height="132" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="1058" y="817" font-size="20" font-weight="700" fill="#b45309" text-anchor="middle">27 ms</text>
  <text x="1058" y="834" font-size="11" fill="#78350f" text-anchor="middle">cả hai lần gọi MCP cộng lại</text>
  <line x1="936" y1="848" x2="1180" y2="848" stroke="#fcd34d" stroke-width="1"/>
  <text x="1058" y="874" font-size="20" font-weight="700" fill="#b45309" text-anchor="middle">99.6%</text>
  <text x="1058" y="891" font-size="11" fill="#78350f" text-anchor="middle">của 7.4 s là 3 lần gọi LLM</text>
  <text x="1058" y="911" font-size="11" font-weight="600" fill="#92400e" text-anchor="middle">Độ trễ ở khâu sinh chữ, không ở tìm kiếm.</text>
</svg>
